# Compiles everything that doesn't need the game (the runtime and its libraries) on Linux, Windows and macOS.
# The recompiled game code can only be built from your own ISO, so CI never builds or uploads a playable program.
name: build check
on: [push, pull_request, workflow_dispatch]

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libsdl2-dev libavcodec-dev \
            libavutil-dev libpng-dev zlib1g-dev
      - run: ./build.sh --check

  windows-msys2:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            git python mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-ffmpeg mingw-w64-ucrt-x86_64-libpng mingw-w64-ucrt-x86_64-zlib
      - run: ./build.sh --check

  windows-cross:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y mingw-w64 nasm curl make pkg-config
      - uses: actions/cache@v4
        with:
          path: build/win-deps
          key: win-deps-${{ hashFiles('tools/cross-windows.sh') }}
      - run: tools/cross-windows.sh --check

  macos:
    strategy:
      matrix:
        os: [macos-latest, macos-15-intel]   # Apple Silicon, Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: brew install pkg-config sdl2 ffmpeg libpng
      - run: ./build.sh --check
